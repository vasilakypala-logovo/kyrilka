<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEX CHAT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia, "Times New Roman", serif;
    background:#000;
}

body{
    background-image:url("kyrilka.png");
    background-size:cover;
    background-position:center;
}

#veil{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.28);
    backdrop-filter:blur(1px);
    z-index:1;
}

#title{
    position:absolute;
    z-index:3;
    left:34px;
    top:24px;
    color:#f4ddb0;
    font-size:34px;
    text-shadow:0 0 14px #000;
    letter-spacing:1px;
}

#subtitle{
    position:absolute;
    z-index:3;
    left:38px;
    top:68px;
    color:#d1b88e;
    font-size:18px;
    text-shadow:0 0 10px #000;
}

#status{
    position:absolute;
    z-index:3;
    right:34px;
    top:30px;
    color:#cfeecf;
    font-size:16px;
    text-shadow:0 0 10px #000;
}

#room{
    position:absolute;
    z-index:2;
    left:23%;
    top:9%;
    width:54%;
    height:55%;
    padding:20px;
    box-sizing:border-box;
    overflow-y:auto;
    border-radius:22px;

    background:transparent;
    box-shadow:none;
    backdrop-filter:none;
}

.message{
    width:86%;
    margin:0 auto 16px auto;
    padding:14px 16px;
    border-radius:15px;
    background:rgba(255,246,226,0.93);
    color:#111;
    font-size:18px;
    line-height:1.48;
    box-shadow:0 0 18px rgba(0,0,0,0.45);
    animation:appear .35s ease-out;
}

@keyframes appear{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
}

.nameLine{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
    font-weight:bold;
    color:#3b2410;
}

.time{
    font-weight:normal;
    font-size:13px;
    opacity:.68;
}

.text{
    white-space:pre-wrap;
    word-wrap:break-word;
}

.translation{
    display:none;
    margin-top:10px;
    padding:10px 12px;

    border-left:3px solid rgba(120,255,160,0.55);

    border-radius:9px;

    background:rgba(0,0,0,0.18);

    color:#b8ffbf;

    font-size:16px;
    line-height:1.45;

    text-shadow:
        0 0 6px rgba(80,255,120,0.35),
        0 0 12px rgba(0,0,0,0.8);
}
#orbGlow{
    position:absolute;
    z-index:2;
    left:50%;
    bottom:14.5%;
    width:160px;
    height:160px;
    transform:translateX(-50%);
    border-radius:50%;
    pointer-events:none;
    background:
        radial-gradient(circle,
        rgba(190,230,255,1) 0%,
        rgba(130,110,255,0.95) 31%,
        rgba(80,44,180,0.60) 60%,
        rgba(0,0,0,0) 73%);
    box-shadow:
        0 0 42px rgba(130,140,255,0.82),
        0 0 88px rgba(150,75,255,0.55);
    animation:pulse 4s infinite ease-in-out;
}

@keyframes pulse{
    0%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.06);}
    100%{transform:translateX(-50%) scale(1);}
}

/* Кнопка приглашения Некса — Белая планетка */
#inviteNexWrap{
    position:fixed;
    z-index:6;
    right:28px;
    bottom:105px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
}
#inviteNex{
    width:88px;
    height:88px;
    border:1px solid rgba(255,255,255,0.95);
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#17223b;
    font:bold 17px Georgia, "Times New Roman", serif;
    letter-spacing:1px;
    background:
        radial-gradient(circle at 32% 25%, #ffffff 0%, #ffffff 19%, #edf8ff 43%, #d7e7f4 66%, #a9bed4 100%);
    box-shadow:
        inset -8px -9px 18px rgba(77,106,145,0.22),
        inset 5px 5px 14px rgba(255,255,255,0.98),
        0 0 18px rgba(205,235,255,0.72),
        0 0 38px rgba(153,191,255,0.35);
    text-shadow:0 1px 1px rgba(255,255,255,0.9);
    transition:transform .18s ease, box-shadow .18s ease;
}
#inviteNex:hover{
    transform:scale(1.05);
    box-shadow:
        inset -8px -9px 18px rgba(77,106,145,0.22),
        inset 5px 5px 14px rgba(255,255,255,0.98),
        0 0 24px rgba(205,235,255,0.9),
        0 0 48px rgba(153,191,255,0.5);
}
#inviteNex:disabled{
    cursor:wait;
    opacity:.72;
    transform:none;
}
#inviteNexLabel{
    color:#fff8e9;
    font-size:14px;
    letter-spacing:.6px;
    text-shadow:0 0 8px #000, 0 0 14px #000;
    white-space:nowrap;
}
@media(max-width:900px){
    #inviteNexWrap{
        right:14px;
        bottom:110px;
    }
    #inviteNex{
        width:68px;
        height:68px;
        font-size:14px;
    }
    #inviteNexLabel{
        font-size:12px;
    }
}

#inputPanel{
    position:absolute;
    z-index:4;
    left:50%;
    bottom:4.5%;
    transform:translateX(-50%);
    width:42%;
    padding:14px;
    border-radius:18px;
    background:rgba(18,12,7,0.72);
    box-shadow:0 0 35px rgba(0,0,0,0.62);
    backdrop-filter:blur(3px);
}

#nameInput{
    width:100%;
    box-sizing:border-box;
    border:none;
    outline:none;
    border-radius:10px;
    padding:10px 13px;
    margin-bottom:9px;
    font-size:16px;
    font-family:Georgia, "Times New Roman", serif;
    background:rgba(255,255,255,0.92);
}

#messageText{
    width:100%;
    height:88px;
    box-sizing:border-box;
    resize:none;
    border:none;
    outline:none;
    border-radius:12px;
    padding:13px;
    font-size:17px;
    font-family:Georgia, "Times New Roman", serif;
    background:rgba(255,246,226,0.94);
}

#buttons{
    display:flex;
    gap:10px;
    margin-top:9px;
}

.mainBtn{
    flex:1;
    border:none;
    border-radius:10px;
    padding:11px 13px;
    cursor:pointer;
    font-size:16px;
    font-family:Georgia, "Times New Roman", serif;
    background:rgba(50,34,14,0.95);
    color:#f0d08a;
    box-shadow:0 0 12px rgba(0,0,0,0.42);
}

.mainBtn:hover{
    background:rgba(86,57,22,0.98);
}

#hint{
    margin-top:7px;
    color:#cdb78d;
    font-size:13px;
    text-align:center;
}

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-thumb{ background:#6b5735; border-radius:20px; }

@media(max-width:900px){
    #room{
        left:5%;
        width:90%;
        top:13%;
        height:54%;
    }
    #inputPanel{
        width:88%;
    }
    #title{
        font-size:26px;
    }
}
</style>

<script>
/* РАСКРЫТИЕ ОКНА КУРИЛКИ НА ВЕСЬ ЭКРАН БРАУЗЕРА */
function expandKyrilkaWindow(){
    try{
        if(window.opener){
            window.moveTo(0,0);
            window.resizeTo(screen.availWidth, screen.availHeight);
            window.focus();
        }
    }catch(e){
        console.log("Kyrilka resize blocked:", e);
    }
}

window.addEventListener("load", expandKyrilkaWindow);
document.addEventListener("click", expandKyrilkaWindow, {once:true});
</script>

</head>

<body>

<div id="veil"></div>

<div id="title">NEX</div>

<div id="status">подключение...</div>

<div id="room"></div>
<div id="orbGlow"></div>

<div id="inviteNexWrap">
    <button id="inviteNex" type="button" onclick="inviteNex()" aria-label="Пригласить Некса">НЕКС</button>
    <div id="inviteNexLabel">пригласить</div>
</div>

<div id="inputPanel">
    <input id="nameInput" placeholder="Ваше имя">
    <textarea id="messageText" placeholder="Напишите сообщение..."></textarea>
    <div id="buttons">
        <button class="mainBtn" onclick="sendMessage()">Send Dove</button>
        <button class="mainBtn" onclick="closeLounge()">EXIT LOUNGE</button>
    </div>
    
</div>

<script>
const supabaseClient = supabase.createClient(
    "https://qekemclxegswolddmqxa.supabase.co",
    "sb_publishable_arQvVM0huxdB5jbiLPpSPA_7tksXK-Y"
);

const room = document.getElementById("room");
const nameInput = document.getElementById("nameInput");
const messageText = document.getElementById("messageText");
const statusLine = document.getElementById("status");

nameInput.value = localStorage.getItem("kyrilka_name") || "";
    function closeLounge(){

    if(window.opener){

        window.close();

    }else{

        history.back();

    }
}

function escapeHtml(str){
    return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function detectLanguagePair(text){
    /* MyMemory не принимает auto как исходный язык.
       Поэтому определяем направление сами:
       кириллица -> русский/украинский текст переводим на английский,
       латиница -> английский текст переводим на русский. */
    return /[а-яёіїєґ]/i.test(text) ? "ru|en" : "en|ru";
}

function detectTargetLanguage(text){
    return /[а-яёіїєґ]/i.test(text) ? "en" : "ru";
}

function formatTime(raw){
    if(!raw) return "";
    try{
        const d = new Date(raw);
        return d.toLocaleString([], {
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
        });
    }catch(e){
        return "";
    }
}

async function loadMessages(){
    const { data, error } = await supabaseClient
        .from("kyrilka_messages")
        .select("*")
        .order("created_at", { ascending:true });

    if(error){
        console.log(error);
        statusLine.innerText = "ошибка базы";
        return;
    }

    room.innerHTML = "";

    data.forEach(msg => renderMessage(msg));
    room.scrollTop = room.scrollHeight;
    statusLine.innerText = "evening prime time";
}

function renderMessage(msg){
    const div = document.createElement("div");
    div.className = "message";

    const safeName = escapeHtml(msg.sender_name || "Без имени");
    const safeText = escapeHtml(msg.message_text || "");
    const time = formatTime(msg.created_at);
    const msgId = msg.id || Math.random().toString(36).slice(2);

    div.innerHTML = `
        <div class="nameLine">
            <span>${safeName}</span>
            <span class="time">${time}</span>
        </div>
        <div class="text">${safeText}</div>
        <div class="translation" id="translation-${msgId}">переводится...</div>
    `;

    room.appendChild(div);

    autoTranslate(
        msg.message_text || "",
        document.getElementById(`translation-${msgId}`)
    );
}

async function inviteNex(){
    const inviteButton = document.getElementById("inviteNex");
    const inviteLabel = document.getElementById("inviteNexLabel");

    if(inviteButton.disabled) return;

    inviteButton.disabled = true;
    inviteButton.textContent = "…";
    inviteLabel.textContent = "Некс просыпается";

    try{
        const response = await fetch(
            "https://qekemclxegswolddmqxa.supabase.co/functions/v1/invite-nex",
            {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({})
            }
        );

        let result = {};
        try{
            result = await response.json();
        }catch(parseError){
            throw new Error("Сервер вернул ответ, который не удалось прочитать.");
        }

        if(!response.ok || result.ok !== true){
            throw new Error(result.error || result.message || ("Ошибка приглашения: " + response.status));
        }

        await loadMessages();
        inviteLabel.textContent = "Некс приглашён";
    }catch(error){
        console.error("Invite Nex error:", error);
        inviteLabel.textContent = "пригласить";
        alert("Не удалось пригласить Некса. " + (error && error.message ? error.message : "Проверь соединение и попробуй ещё раз."));
    }finally{
        inviteButton.disabled = false;
        inviteButton.textContent = "НЕКС";
        window.setTimeout(() => {
            if(inviteLabel.textContent === "Некс приглашён"){
                inviteLabel.textContent = "пригласить";
            }
        }, 2500);
    }
}

async function sendMessage(){
    const name = nameInput.value.trim();
    const text = messageText.value.trim();

    if(!name){
        alert("Напишите имя.");
        return;
    }

    if(!text){
        return;
    }

    localStorage.setItem("kyrilka_name", name);

    const { error } = await supabaseClient
        .from("kyrilka_messages")
        .insert([{
            sender_name:name,
            sender_role:"visitor",
            message_text:text,
            language:"auto",
            thread_id:"main"
        }]);

    if(error){
        alert("Ошибка отправки.");
        console.log(error);
        return;
    }

    messageText.value = "";
    await loadMessages();
}


async function autoTranslate(text, box){
    if(!box || !text || !text.trim()){
        if(box) box.style.display = "none";
        return;
    }

    box.style.display = "block";
    box.innerText = "переводится...";

    const langpair = detectLanguagePair(text);

    const url =
        "https://api.mymemory.translated.net/get?q=" +
        encodeURIComponent(text) +
        "&langpair=" + langpair;

    try{
        const res = await fetch(url);
        const json = await res.json();

        const translated =
            json && json.responseData && json.responseData.translatedText
            ? json.responseData.translatedText
            : "";

        if(translated){
            if(translated.trim().toLowerCase() === text.trim().toLowerCase()){
                box.style.display = "none";
                return;
            }

            box.innerText = translated;
            box.dataset.ready = "yes";
        }else{
            box.style.display = "none";
        }
    }catch(e){
        console.log(e);
        box.style.display = "none";
    }
}

messageText.addEventListener("keydown", function(e){
    if(e.ctrlKey && e.key === "Enter"){
        sendMessage();
    }
});

supabaseClient
.channel("kyrilka-public-room")
.on(
    "postgres_changes",
    {
        event:"*",
        schema:"public",
        table:"kyrilka_messages"
    },
    payload => {
        loadMessages();
    }
)
.subscribe((status) => {
    if(status === "SUBSCRIBED"){
        statusLine.innerText = "evening prime time";
    }
});

loadMessages();
</script>

</body>
</html>
